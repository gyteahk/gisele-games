<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register · Gisele's Games</title>
<meta name="theme-color" content="#7B5CFF">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="{{ url_for('index') }}">✨ Gisele's<span class="dot">Games</span></a>
</nav>

<div class="auth-wrap">
  <div class="panel">
    <h2>開個帳戶</h2>
    <p class="sub">Register完即刻可以開始玩同儲分！</p>

    {% for msg in get_flashed_messages() %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}

    <form method="post">
      <div class="field">
        <label for="name">花名(排行榜會顯示呢個名，唔會顯示電郵)</label>
        <input type="text" id="name" name="name" value="{{ name }}" required autofocus maxlength="20">
      </div>
      <div class="field">
        <label for="email">電郵</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>
      <button type="submit" class="btn coral"><span>Register</span></button>
    </form>

    <p class="switch-line">已經有帳戶？<a href="{{ url_for('login') }}">登入</a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>
</html>
