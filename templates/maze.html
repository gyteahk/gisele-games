<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gisele's Maze</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7B5CFF">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/maze.css') }}">
</head>
<body class="maze-page">
<nav class="nav">
  <a class="brand" href="{{ url_for('index') }}">✨ Gisele's<span class="dot">Games</span></a>
  <div class="nav-right">
    <a class="points-chip" href="{{ url_for('leaderboard') }}">⭐ {{ points }}</a>
    <a class="nav-link" href="{{ url_for('logout') }}">登出</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="hero-burst"></div>
    <div class="title maze-title">GISELE'S<br><span class="accent">MAZE</span></div>
  </div>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="操控模式">
      <button type="button" class="active" data-mode="swipe">拖動移動</button>
      <button type="button" data-mode="draw">畫線過關</button>
    </div>
    <div class="seg" role="group" aria-label="難度">
      <button type="button" class="diff-easy" data-difficulty="easy">易</button>
      <button type="button" class="active diff-medium" data-difficulty="medium">中</button>
      <button type="button" class="diff-hard" data-difficulty="hard">難</button>
    </div>
    <button type="button" class="icon-btn" id="btnNewMaze">🔀 換一鋪</button>
  </div>

  <div class="hud">
    <span class="chip">⏱ <span id="hudTime">00:00</span></span>
    <span class="chip">👣 <span id="hudSteps">0</span></span>
  </div>

  <p class="hint" id="hintSwipe">用手指喺畫面度拖，個波就會跟住郁，撞到牆就唔會過</p>
  <p class="hint" id="hintDraw" hidden>由波嗰度開始，用手指畫一條路去到金星，唔可以穿牆</p>

  <div class="maze-center" id="mazeCenter">
    <div class="maze-stage" id="mazeStage">
      <canvas id="mazeCanvas"></canvas>
    </div>
  </div>
</div>

<div class="win-overlay" id="winOverlay" hidden>
  <div class="win-card welcome-card">
    <img class="welcome-art" src="{{ url_for('static', filename='img/art/win.jpg') }}" alt="過關喇！">
    <p>用時 <span id="winTime">00:00</span> · <span id="winSteps">0</span> 步 · <span id="winPoints"></span></p>
    <div class="win-actions">
      <button type="button" class="btn coral" id="btnPlayAgain"><span>再玩一鋪</span></button>
      <a class="btn ghost small" href="{{ url_for('index') }}"><span>返去主頁</span></a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/maze.js') }}"></script>
<script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>
</html>
