<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Diamond Hacher</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7B5CFF">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/diamond-hacher.css') }}">
</head>
<body class="dh-page">
<nav class="nav">
  <a class="brand" href="{{ url_for('index') }}">✨ Gisele's<span class="dot">Games</span></a>
  <div class="nav-right">
    <a class="points-chip" href="{{ url_for('leaderboard') }}">⭐ {{ points }}</a>
    <a class="nav-link" href="{{ url_for('logout') }}">登出</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="hero-burst"></div>
    <div class="title dh-title">DIAMOND<br><span class="accent">HACHER</span></div>
  </div>

  <p class="hint dh-rules">佢睇緊就唔好撳；一轉頭就快啲偷！第一個偷到 <strong>10</strong> 粒鑽石嘅人贏。鍵盤：A / L</p>

  <div class="dh-scores">
    <div class="dh-score p1" id="scoreP1">
      <div class="dh-score-name">玩家 1</div>
      <div class="dh-gems" id="gemsP1"></div>
      <div class="dh-score-num"><span id="countP1">0</span>/10</div>
    </div>
    <div class="dh-purse-chip" id="purseChip">
      <span class="dh-purse-icon">👜</span>
      <span>仲有 <strong id="purseLeft">20</strong> 粒</span>
    </div>
    <div class="dh-score p2" id="scoreP2">
      <div class="dh-score-name">玩家 2</div>
      <div class="dh-gems" id="gemsP2"></div>
      <div class="dh-score-num"><span id="countP2">0</span>/10</div>
    </div>
  </div>

  <div class="dh-layout" id="dhLayout">
    <button type="button" class="dh-steal p1" id="btnP1" data-player="p1">
      <span class="dh-steal-name">玩家 1</span>
      <span class="dh-steal-action">偷鑽石！</span>
      <span class="dh-steal-key">A</span>
    </button>

    <div class="dh-stage">
      <div class="dh-status watching" id="dhStatus">👀 準備…</div>
      <div class="dh-bubble" id="dhBubble">我嘅鑽石～唔准偷！</div>
      <div class="dh-girl-frame" id="dhGirlFrame">
        <img id="dhGirl" src="{{ url_for('static', filename='img/diamond_hacher/watching.jpg') }}" alt="Hacher 同佢嘅鑽石手袋">
      </div>
    </div>

    <button type="button" class="dh-steal p2" id="btnP2" data-player="p2">
      <span class="dh-steal-name">玩家 2</span>
      <span class="dh-steal-action">偷鑽石！</span>
      <span class="dh-steal-key">L</span>
    </button>
  </div>
</div>

<div class="win-overlay" id="startOverlay">
  <div class="win-card welcome-card">
    <img class="welcome-art" src="{{ url_for('static', filename='img/covers/diamond_hacher_cover.jpg') }}" alt="Diamond Hacher">
    <h2>偷走 Hacher 嘅鑽石！</h2>
    <p>兩個玩家同一個畫面。Hacher 睇緊手袋就唔好撳；佢一轉頭，就快啲撳「偷鑽石」。被捉住會俾佢搶返一粒。第一個偷到 10 粒就贏！</p>
    <div class="win-actions">
      <button type="button" class="btn coral" id="btnStart"><span>開始偷！</span></button>
      <a class="btn ghost small" href="{{ url_for('index') }}"><span>返去主頁</span></a>
    </div>
  </div>
</div>

<div class="dh-count" id="dhCount" hidden>3</div>

<div class="win-overlay" id="resultOverlay" hidden>
  <div class="win-card welcome-card">
    <img class="welcome-art" id="resultArt" src="{{ url_for('static', filename='img/art/win.jpg') }}" alt="贏咗！">
    <h2 id="resultTitle">玩家 1 贏咗！</h2>
    <p id="resultMsg">計分緊…</p>
    <div class="win-actions">
      <button type="button" class="btn coral" id="btnPlayAgain"><span>再嚟一局</span></button>
      <a class="btn ghost small" href="{{ url_for('index') }}"><span>返去主頁</span></a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/diamond-hacher.js') }}"></script>
<script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>
</html>
