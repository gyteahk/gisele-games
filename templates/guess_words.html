<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gisele's Word Melt</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1FCFC0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/guess-words.css') }}">
</head>
<body class="gw-page">
<nav class="nav">
  <a class="brand" href="{{ url_for('index') }}">✨ Gisele's<span class="dot">Games</span></a>
  <div class="nav-right">
    <a class="points-chip" href="{{ url_for('leaderboard') }}">⭐ {{ points }}</a>
    <a class="nav-link" href="{{ url_for('logout') }}">登出</a>
  </div>
</nav>

<div class="wrap">
  <div class="hero">
    <div class="hero-burst"></div>
    <div class="title gw-title">GISELE'S<br><span class="accent">WORD MELT</span></div>
  </div>

  <div class="toolbar">
    <button type="button" class="icon-btn" id="btnHint">💡 提示 (3)</button>
    <button type="button" class="icon-btn" id="btnNewWord">🔀 換新字</button>
  </div>

  <div class="hud">
    <div class="gw-snowman" id="gwSnowman" aria-hidden="true">
      <svg viewBox="0 0 100 145" width="100%" height="100%">
        <g id="swPuddle" class="sw-part sw-puddle">
          <ellipse cx="50" cy="128" rx="36" ry="9" fill="#BEE6F5" stroke="var(--ink)" stroke-width="3"/>
          <ellipse cx="16" cy="132" rx="8" ry="4" fill="#BEE6F5" stroke="var(--ink)" stroke-width="2.5"/>
          <ellipse cx="84" cy="130" rx="7" ry="3.5" fill="#BEE6F5" stroke="var(--ink)" stroke-width="2.5"/>
          <polygon points="42,126 58,126 50,133" fill="#FF9F45" stroke="var(--ink)" stroke-width="2"/>
          <circle cx="28" cy="124" r="2.6" fill="var(--ink)"/>
          <circle cx="70" cy="126" r="2.6" fill="var(--ink)"/>
        </g>

        <g id="swBody" class="sw-part">
          <circle cx="50" cy="112" r="26" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
          <circle cx="50" cy="78" r="20" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
        </g>

        <g id="swHead" class="sw-part">
          <circle cx="50" cy="44" r="15" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
        </g>

        <g id="swButtons" class="sw-part">
          <circle cx="50" cy="70" r="3" fill="var(--ink)"/>
          <circle cx="50" cy="82" r="3" fill="var(--ink)"/>
          <circle cx="50" cy="94" r="3" fill="var(--ink)"/>
        </g>

        <g id="swEyes" class="sw-part">
          <circle cx="44" cy="40" r="2.4" fill="var(--ink)"/>
          <circle cx="56" cy="40" r="2.4" fill="var(--ink)"/>
        </g>

        <g id="swArmL" class="sw-part">
          <line x1="30" y1="76" x2="8" y2="60" stroke="#8B5E34" stroke-width="4" stroke-linecap="round"/>
          <line x1="16" y1="62" x2="8" y2="60" stroke="#8B5E34" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g id="swArmR" class="sw-part">
          <line x1="70" y1="76" x2="92" y2="60" stroke="#8B5E34" stroke-width="4" stroke-linecap="round"/>
          <line x1="84" y1="62" x2="92" y2="60" stroke="#8B5E34" stroke-width="3" stroke-linecap="round"/>
        </g>

        <g id="swNose" class="sw-part">
          <polygon points="50,44 63,48 50,52" fill="#FF9F45" stroke="var(--ink)" stroke-width="2"/>
        </g>

        <g id="swHat" class="sw-part">
          <rect x="34" y="22" width="32" height="7" rx="3" fill="var(--pop-purple)" stroke="var(--ink)" stroke-width="3"/>
          <rect x="39" y="5" width="22" height="19" fill="var(--pop-purple)" stroke="var(--ink)" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <span class="chip">☃️ 剩 <span id="hudGuesses">8 / 8</span> 次機會</span>
  </div>

  <p class="gw-category" id="categoryLabel"></p>

  <div class="gw-center" id="gwCenter">
    <div class="gw-play" id="gwPlay">
      <div class="gw-grid" id="gwGrid"></div>
      <div class="keyboard" id="keyboard"></div>
    </div>
  </div>
</div>

<div class="win-overlay" id="resultOverlay" hidden>
  <div class="win-card welcome-card">
    <img class="welcome-art" id="resultArt" src="" alt="">
    <p id="resultMsg"></p>
    <div class="win-actions">
      <button type="button" class="btn coral" id="btnPlayAgain"><span>再估一個</span></button>
      <a class="btn ghost small" href="{{ url_for('index') }}"><span>返去主頁</span></a>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/guess-words.js') }}"></script>
<script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>
</html>
