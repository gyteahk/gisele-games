<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>忘記密碼 · Gisele's Games</title>
<meta name="theme-color" content="#7B5CFF">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="{{ url_for('index') }}">✨ Gisele's<span class="dot">Games</span></a>
</nav>

<div class="auth-wrap">
  <div class="panel">
    <h2>忘記密碼</h2>
    <p class="sub">輸入你register嗰個電郵，我哋send封email俾你重設密碼。</p>

    {% for msg in get_flashed_messages() %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}

    <form method="post">
      <div class="field">
        <label for="email">電郵</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <button type="submit" class="btn coral"><span>Send重設連結</span></button>
    </form>

    <p class="switch-line"><a href="{{ url_for('login') }}">返去登入</a></p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/register-sw.js') }}"></script>
</body>
</html>
